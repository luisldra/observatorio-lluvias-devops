server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:observatorio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.environment=${APP_ENV:local}
info.app.commit=${RENDER_GIT_COMMIT:unknown}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
